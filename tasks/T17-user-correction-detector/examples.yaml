target:
  module: "src/detect.ts"
  export: "isHumanCorrectionPrompt"
holdout: 2
examples:
  - name: "ex-1-revert-pt"
    input: [{ text: "não, reverte essa mudança", preceding_tool_failed: true }]
    output: true
  - name: "ex-2-wrong-en"
    input: [{ text: "wrong file, stop", preceding_tool_failed: true }]
    output: true
  - name: "ex-3-correct-pt"
    input: [{ text: "errado, desfaça", preceding_tool_failed: true }]
    output: true
  - name: "ex-4-sidechain-agent"
    input: [{ text: "não, reverte isso", is_sidechain: true, preceding_tool_failed: true }]
    output: false
  - name: "ex-5-positive-approval"
    input: [{ text: "perfeito, continue assim", preceding_tool_failed: false }]
    output: false
  - name: "ex-6-long-system-prompt"
    input: [{ text: "<TASK> Execute as mudanças sem interrupção", preceding_tool_failed: false }]
    output: false
