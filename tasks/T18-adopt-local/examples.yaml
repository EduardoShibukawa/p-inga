target:
  module: "src/adopt.ts"
  export: "classifyAdoptTarget"
holdout: 2
examples:
  - name: "ex-1-claude-local"
    input: [{ target: "claude-local", exists: true, is_owned: false, is_broken_symlink: false }]
    output: "adoptable"
  - name: "ex-2-broken-symlink"
    input: [{ target: "pi-symlink", exists: false, is_owned: false, is_broken_symlink: true }]
    output: "broken_symlink"
  - name: "ex-3-missing-file"
    input: [{ target: "missing", exists: false, is_owned: false, is_broken_symlink: false }]
    output: "missing"
  - name: "ex-4-already-owned"
    input: [{ target: "owned-entry", exists: true, is_owned: true, is_broken_symlink: false }]
    output: "already_owned"
  - name: "ex-5-opencode-plugin"
    input: [{ target: "opencode-local", exists: true, is_owned: false, is_broken_symlink: false }]
    output: "adoptable"
  - name: "ex-6-unrelated-file"
    input: [{ target: "random-file", exists: true, is_owned: false, is_broken_symlink: false }]
    output: "ignored"
